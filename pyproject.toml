[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobqueue"
version = "0.1.0"
description = "A lightweight, production-quality job queue in Python 3.11+ backed by SQLite"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "vatsh567890-ctrl" },
]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "pytest-cov==6.0.0",
    "ruff==0.9.9",
    "mypy==1.15.0",
]

[project.scripts]
jobqueue = "jobqueue.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-ra --strict-markers"
timeout = 30
